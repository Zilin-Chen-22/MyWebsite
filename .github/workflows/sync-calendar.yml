name: Sync public availability

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-availability
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published Outlook calendar
        env:
          CALENDAR_ICS_URL: https://outlook.live.com/owa/calendar/20c7b5d5-4cea-41ea-b93a-f253195c38ad/6373ccaf-37a2-4adb-bb58-3a4d8ffb971d/cid-651F26A1F27394B5/calendar.ics
        run: curl --fail --silent --show-error --location --retry 3 "$CALENDAR_ICS_URL" --output /tmp/zilin-calendar.ics
      - name: Build privacy-safe busy-time data
        run: node scripts/build-calendar-data.cjs --input /tmp/zilin-calendar.ics --output assets/data/calendar.json
      - name: Publish changes when availability changed
        run: |
          if git diff --quiet -- assets/data/calendar.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/calendar.json
          git commit -m "Update published availability"
          git push
